name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check release identifiers
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'))
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          const versions = JSON.parse(readFileSync('versions.json', 'utf8'))
          const cli = execFileSync(process.execPath, ['dist/wi/wi.js', '--version'], { encoding: 'utf8' }).trim()
          if (pkg.version !== manifest.version || cli !== manifest.version || lock.version !== manifest.version || lock.packages[''].version !== manifest.version) throw new Error('Release versions must agree')
          if (versions[manifest.version] !== manifest.minAppVersion) throw new Error('Missing compatibility mapping')
          NODE
