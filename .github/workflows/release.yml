name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check release versions
        id: release_files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'

          const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'))
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const versions = JSON.parse(readFileSync('versions.json', 'utf8'))
          const tag = process.env.RELEASE_TAG

          if (tag !== manifest.version || tag !== pkg.version) {
            throw new Error(`Tag ${tag} must equal manifest and package versions (${manifest.version}, ${pkg.version})`)
          }
          if (versions[tag] !== manifest.minAppVersion) {
            throw new Error(`versions.json must map ${tag} to ${manifest.minAppVersion}`)
          }
          if (pkg.name !== 'recursive-board') {
            throw new Error('The npm package must be named recursive-board')
          }

          appendFileSync(process.env.GITHUB_OUTPUT, 'plugin_dir=dist\n')
          NODE
      - name: Attest plugin release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_DIR: ${{ steps.release_files.outputs.plugin_dir }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$PLUGIN_DIR/main.js" \
            "$PLUGIN_DIR/manifest.json" \
            "$PLUGIN_DIR/styles.css" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
      # npm trusted publishing: npm authenticates this job through its GitHub OIDC token (id-token: write).
      - name: Publish wi to npm
        run: |
          npm publish --provenance --access public
